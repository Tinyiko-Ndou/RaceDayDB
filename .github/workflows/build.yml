name: RaceDay Repository Validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f docs/RaceDay_ERD.pdf
          test -f docs/ApiEndpoint_Plan.pdf
          test -f docs/RaceDayDB.sql

      - name: Validate SQL script
        run: |
          test -s docs/RaceDayDB.sql

      - name: Validation successful
        run: echo "RaceDay repository validation passed successfully!"
